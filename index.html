<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Thieru's World Cup Pool 2026
    </title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header>

    <h1>
        🏆 Thieru's World Cup Pool 2026
    </h1>

</header>

<main>

    <section>

        <h2>🏆 Leaderboard</h2>

        <div>
            <p>Total Players: <span id="playerCount">0</span></p>
<p>Total Pool: RM<span id="totalPool">0</span></p>
<p>Top Balance: RM<span id="topBalance">0</span></p>
        </div>

    </section>

    <section>

        <h2>Add Player</h2>

        <input
            id="playerName"
            type="text"
            placeholder="Player Name">

        <input
            id="playerBalance"
            type="number"
            placeholder="Starting Balance">

        <button id="addPlayerBtn">
            Add Player
        </button>

    </section>

    <section>

        <h2>🚀 Players Test 🚀</h2>

        <ul id="playersList"></ul>

    </section>

</main>

<script type="module" src="js/app.js"></script>

</body>
</html>
